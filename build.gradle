plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.bimapr239.soundboard'
    compileSdk 33

    defaultConfig {
        applicationId "com.bimapr239.soundboard"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
}
